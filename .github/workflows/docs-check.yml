name: docs-check

# Documentation is validated even when code is not touched: broken links, cited paths that no
# longer exist, malformed or misnumbered ADRs.
on:
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.assistant/**'
      - 'tools/check-docs.mjs'
      - '.docs-check.json'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.assistant/**'
      - 'tools/check-docs.mjs'
      - '.docs-check.json'

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/check-docs.mjs
