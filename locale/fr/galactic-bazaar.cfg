kind-contract-guarantee-tooltip=Dépôt plus pénalité, bloqués quand vous acceptez un contrat. Ils reviennent quand le contrat est rempli ; ils sont perdus s'il échoue.
kind-contract-installment=Versement reçu
kind-contract-installment-tooltip=Part de la récompense d'un contrat déjà gagnée par vos livraisons, versée à chaque période tant qu'il court ; le reste vient quand il est rempli.
kind-contract-charge=Redevance
kind-contract-charge-tooltip=La redevance d'une période : une location de machine, une concession ou une sous-traitance la paie une fois la période livrée ; un prêt paie son échéance. Une redevance que vos fonds ne couvrent pas fait échouer le contrat.
kind-contract-fulfilled=Contrat rempli
kind-contract-fulfilled-tooltip=Le contrat s'est bien terminé : la garantie revient, avec le reste de la récompense. Livrer toutes les unités exigées fait monter votre réputation de 1, sauf quand vous louez une machine ou un entrepôt ; un bail arrivé à son terme ou un prêt remboursé la laisse inchangée.
kind-contract-failed=Contrat échoué
kind-contract-failed-tooltip=L'échéance est passée, le contrat a été abandonné, une redevance n'a pas pu être payée, ou la force a fait faillite : la garantie est perdue (rien ne revient) et votre réputation baisse.
kind-contract-voided=Contrat annulé
kind-contract-voided-tooltip=Les marchandises du contrat n'existent plus (un mod a été retiré) : il est annulé et la garantie revient ; la réputation ne change pas.
kind-contract-advance=Avance de prêt
kind-contract-advance-tooltip=Le capital d'un prêt, versé quand vous le contractez. Vous le remboursez avec intérêts par échéances (entrées Redevance).
kind-contract-repaid=Prêt remboursé
kind-contract-repaid-tooltip=Toutes les échéances restantes d'un prêt, intérêts compris, payées d'un coup pour le rembourser par anticipation.
kind-loan-arrears=Arriérés prélevés
kind-loan-arrears-tooltip=Échéances d'un prêt en défaut, prélevées chaque seconde sur vos fonds disponibles jusqu'à la limite du découvert. Fusionnés par minute.
kind-overdraft-interest=Intérêts débiteurs
kind-overdraft-interest-tooltip=Toutes les __2__ min, un solde passé sous zéro paie __1__ % de son point le plus bas depuis le dernier prélèvement, la dette comptée jusqu'à la limite du découvert. Fusionnés par 10 minutes.
kind-bankruptcy-restructured=Faillite
kind-bankruptcy-restructured-tooltip=Une faillite ramène le solde à 0 : ce qui était dû (le découvert, les arriérés et les prêts restants), plus une majoration de __1__ %, devient une dette de faillite gelée.
kind-bankruptcy-debt=Dette de faillite remboursée
kind-bankruptcy-debt-tooltip=Chaque crédit reçu rembourse d'abord la dette de faillite, dans la limite d'un solde positif. Fusionnée par minute.
kind-other=Autre
kind-other-tooltip=Une transaction de type « __1__ », que cette version ne décrit pas.

