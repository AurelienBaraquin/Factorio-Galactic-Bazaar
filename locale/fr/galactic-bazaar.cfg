[gb-insolvency]
insolvent=Vous êtes en cessation de paiement : votre solde dépasse la limite de découvert, ou vous devez des arriérés que vous ne pouvez pas payer. Ramenez le solde à au moins __1__ crédits et maintenez-le une minute, dans les __2__ min, sinon c'est la faillite. Aucun contrat ni prêt n'est accepté d'ici là ; la vente reste possible.
recovered=Vous êtes de nouveau solvable.
bankrupt=Faillite : contrats ouverts terminés : __1__ (garanties conservées) ; __2__ crédits dus (solde, arriérés, prêts, plus __5__ % pour la restructuration) gelés sans intérêts, chaque crédit reçu leur revenant d'abord ; réputation ramenée à __3__ ; ni prêt ni découvert pendant __4__ min et tant que cette dette n'est pas remboursée.
credit-restored=Crédit rétabli : les prêts et le découvert sont de nouveau disponibles.
