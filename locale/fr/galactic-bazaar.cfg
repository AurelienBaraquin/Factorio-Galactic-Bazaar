[entity-description]
gb-rental-assembler=Loué à des contreparties : il ne fabrique que ce qu'un contrat de location demande, avec les ingrédients qu'elles fournissent et les produits qu'elles reprennent. Vous fournissez l'électricité. Nécessite un hub de négociation à moins de 10 cases.
gb-contract-chest=Les produits qu'on y dépose sont remis à vos contrats entrants en cours, du plus ancien au plus récent, quand un hub de négociation est à moins de 10 cases.
gb-catapult=Vend d'un seul tir tout ce qu'elle contient au marché galactique, au plus toutes les 2 s, tant que chaque unité rapporte au moins la moitié de sa valeur de base. Chaque tir prend 50 MJ au réseau électrique ; sans cela, pas de tir. Nécessite un hub de négociation alimenté à moins de 10 cases.
gb-teleporter=Consomme 20 MW. Tant qu'il est alimenté, le hub de négociation à moins de 10 cases livre par téléporteur : 20 piles par seconde, arrivée en 1 s, 1 % de fret. Sans courant, ses envois attendent.
gb-docking-bay=Contient du carburant chimique. Tant qu'elle en a assez, le hub de négociation à moins de 10 cases livre par navette cargo : 40 piles toutes les 5 s, arrivée en 20 s, 3 % de fret. Chaque navette brûle 100 MJ (un carburant de fusée) ; une commande que le carburant ne couvre pas part par capsule orbitale.
gb-fluid-export=Vend chaque seconde au marché galactique le fluide qu'il contient, tant qu'il rapporte au moins la moitié de sa valeur de base, via un hub de négociation alimenté à moins de 10 cases.
gb-fluid-import=Reçoit les fluides achetés sur le marché, livrés par le palier de livraison de son hub de négociation ; nécessite un hub de négociation à moins de 10 cases. Ne contient qu'un fluide à la fois : une fois qu'il en contient un, il ne reçoit que ce fluide jusqu'à ce qu'il soit vidé.
gb-order-combinator=Lit les signaux d'articles et de fluides sur son entrée logique et, toutes les 10 s, achète autant d'unités de chacun (articles de qualité normale), livrées par le palier de livraison du hub dans les coffres ou manifolds d'import d'un hub de négociation alimenté à moins de 10 cases. N'achète rien sans signal Budget positif, qui plafonne ce que votre force dépense par les combinateurs d'ordres toutes les 10 s. Refuse une entrée portant le signal Crédits ou Flux de prix des combinateurs de prix.
gb-buy-price-combinator=Émet le prix d'achat d'une unité de chaque article et fluide, en milli-crédits (1,32 crédit = 1320), et le solde de la force en crédits sur le signal Crédits (et 1 sur le signal Flux de prix), via un hub de négociation alimenté à moins de 10 cases. Prix rafraîchis environ toutes les 10 s (plus avec beaucoup de combinateurs), solde en quelques secondes.
gb-sell-price-combinator=Émet le prix de vente d'une unité de chaque article et fluide, en milli-crédits (1,32 crédit = 1320), et le solde de la force en crédits sur le signal Crédits (et 1 sur le signal Flux de prix), via un hub de négociation alimenté à moins de 10 cases. Prix rafraîchis environ toutes les 10 s (plus avec beaucoup de combinateurs), solde en quelques secondes.
gb-power-export=Vend le surplus du réseau électrique au marché galactique, via un hub de négociation alimenté à moins de 10 cases. Ne se charge que sur le surplus, comme un accumulateur.
gb-power-import=Achète au marché galactique l'électricité qui manque au réseau, via un hub de négociation alimenté à moins de 10 cases. Ne se décharge qu'en cas de manque, comme un accumulateur.
gb-export-chest=Le marché achète ce que vous y déposez, chaque qualité à son propre prix, tant que chaque unité rapporte au moins la moitié de sa valeur de base ; les biens endommagés, usés ou porteurs de données sont gardés. Nécessite un hub de négociation alimenté à moins de 10 cases.
gb-import-chest=Reçoit les marchandises achetées sur le marché, les ingrédients de vos contrats de fabrication et ce que les planètes PNJ vous expédient, livrés à son hub de négociation à moins de 10 cases.
gb-hub=Bâtiment central du Galactic Bazaar : cliquez dessus pour ouvrir la fenêtre sur son onglet Marché et négocier par son intermédiaire. Les bâtiments du mod se rattachent au hub de leur force le plus proche à moins de 10 cases, de préférence un hub alimenté. Il a besoin d'électricité pour négocier, et expédie chaque achat par le meilleur palier de livraison que ses bâtiments fournissent, qui a de la place dans sa file et de quoi assurer la commande (le combustible d'une baie d'amarrage), jusqu'à la capsule orbitale.
gb-vault-uplink=Ce que vous y mettez part dans les coffres-forts que votre force loue à son hub de négociation (à moins de 10 cases), jusqu'à leurs piles. Les liaisons sont visitées à tour de rôle, deux tous les dixièmes de seconde (20 par seconde), et chaque visite de deux liaisons déplace au plus 10 piles en tout (une pile partagée entre deux coffres-forts compte deux fois). Objets de qualité normale seulement, non périssables, intacts et sans données ; le reste y demeure.
gb-rental-warehouse=Loué à des contreparties : elles y entreposent des marchandises pendant 30 minutes, les reprennent à la fin via un hub de négociation à moins de 10 cases, puis paient le loyer. Vous ne pouvez pas l'ouvrir. En sortir les marchandises avec un bras robotisé, ou le miner ou le déconstruire (ses marchandises vous reviennent alors), fait échouer le contrat et la garantie est conservée.

