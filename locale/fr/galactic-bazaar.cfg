overdraft-terms=Achats, garanties et redevances peuvent faire passer le solde sous zéro, jusqu'à moins la limite de découvert. Toutes les __2__ min, un solde passé sous zéro paie __1__ % d'intérêts sur son point le plus bas (la dette comptée jusqu'à la limite), même au-delà de la limite.
insolvent=Cessation de paiement : faillite dans __1__
insolvent-terms=Votre solde a dépassé la limite de découvert, ou vous devez des arriérés que vous ne pouvez pas payer. Gardez un solde d'au moins __1__ crédits pendant une minute entière, sans arriérés, pour vous rétablir ; d'ici là, aucun contrat ni prêt n'est accepté. La vente reste possible.
credit-ban=Faillite : aucun crédit pendant __1__, __2__ de dette à rembourser
credit-ban-time=Faillite : aucun crédit pendant __1__
credit-ban-debt=Faillite : aucun crédit tant que __1__ de dette n'est pas remboursé
credit-ban-terms=Après une faillite, aucun prêt n'est accordé et la limite de découvert est de 0 tant que ce délai n'est pas écoulé et que la dette de faillite n'est pas remboursée. La dette ne porte pas d'intérêts ; chaque crédit que vous recevez lui revient d'abord. Chaque nouvelle faillite double ce délai, jusqu'à 8 heures.
