unavailable=impossible
refused-invalid-amount=Montant invalide.
refused-not-tradeable=Cet article ne peut pas être échangé.
refused-invalid-quantity=Quantité invalide.
refused-insufficient-liquidity=Le marché ne peut pas absorber autant pour l'instant.
refused-insufficient-funds=Crédits insuffisants.
sold=__1__ × __2__ vendus pour __3__ crédits.
sold-nothing=Rien de vendu : aucune pile intacte et inutilisée de cet article dans votre inventaire.
delivery=Livraison : __1__, __2__ / __3__ en file
