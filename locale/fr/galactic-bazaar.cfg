refused-tier-changed=L'aperçu affiché valait pour un autre hub ou palier de livraison : vérifiez le nouveau prix et réessayez.
sell-fluid=Les fluides se vendent par les manifolds d'export, pas depuis l'inventaire.
refused-no-import-manifold=Ce hub n'a aucun manifold d'import de votre force à portée qui soit vide ou contienne déjà ce fluide.
history=Historique : __1__
