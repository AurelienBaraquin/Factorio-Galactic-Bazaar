summary-tooltip=Toutes les __1__ en moyenne à la fréquence 1 (de la moitié à une fois et demie, divisé par le paramètre de fréquence), la galaxie peut tirer une pénurie, un excédent ou une crise. __2__ % des événements sont annoncés __3__ à l'avance, et __4__ % des prévisions sont annulées à leur échéance. Au plus __5__ événements sont annoncés ou en cours à la fois, et un bien ne reçoit pas de nouvel événement tant que le dernier ne s'est pas estompé. Un événement ne fait jamais qu'empirer un prix : une pénurie fait monter ce que paient les acheteurs, les vendeurs recevant le prix habituel ; un excédent fait baisser ce que reçoivent les vendeurs, les acheteurs payant le prix habituel. Aucun échange ne fait donc mieux avec un événement que sans. Les administrateurs règlent la fréquence et l'ampleur dans Paramètres → Paramètres des mods → Carte.
