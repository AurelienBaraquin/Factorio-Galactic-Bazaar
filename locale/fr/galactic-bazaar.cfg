[gb-contracts]
kind-loan=Prêt : le prêteur a avancé le capital, vous le remboursez avec intérêts toutes les __1__ minutes. Une échéance impayée le fait tomber en défaut : le reste demeure dû en arriérés.
kind-outsourcing=Production sous-traitée : une planète fabrique pour vous et expédie les produits toutes les 5 minutes, facturés à chaque fois.
kind-concession=Concession minière : une planète vous expédie du minerai toutes les 5 minutes, facturé à chaque fois.
charge-terms=Redevance __1__ toutes les 5 min, garantie __2__
refused-machine-gone=La machine louée n'existe plus ou ne vous appartient plus.
refused-machine-no-hub=La machine louée n'a aucun hub de négociation à moins de 10 cases pour la servir.
kind-incoming=Fabriquer pour elle : elle livre les ingrédients, vous remettez les produits dans un coffre de contrat.
kind-rental=Location de machine : un de vos assembleurs de location fabrique pour elle, loyer versé toutes les 5 minutes.
reputation=Réputation : __1__
none=Aucune offre pour l'instant : les contreparties en envoient une toutes les 5 minutes, jusqu'à 3 à la fois.
terms=Récompense __1__, garantie __2__
offer-ends=Offre valable __1__
due-in=Échéance dans __1__
accept=Accepter
abandon=Abandonner
decline=Refuser
refused-not-offered=Cette offre n'est plus ouverte.
refused-unknown=Ce contrat n'existe plus.
refused-expired=Cette offre a expiré.
refused-insufficient-funds=Pas assez de crédits pour déposer la garantie.
refused-insolvent=Vous êtes en cessation de paiement : aucun contrat n'est accepté avant votre rétablissement.
refused-no-import-chest=Ce hub n'a aucun coffre d'import de votre force à portée pour recevoir les ingrédients.
refused-no-import-manifold=Ce hub n'a aucun manifold d'import qui puisse recevoir les ingrédients.
refused-queue-full=Trop d'envois déjà en file pour ce hub : attendez, puis acceptez.
refused-not-tradeable=Un ingrédient de ce contrat ne peut plus être livré.
refused-invalid-quantity=Les quantités de ce contrat ne sont pas valides.
provides-incoming-tooltip=Ingrédients que la contrepartie vous expédie, gratuitement, par capsule orbitale dans les coffres d'import du hub où vous acceptez.
provides-rental-tooltip=Ingrédients que fournit la contrepartie : ils sont placés directement dans votre assembleur de location, quelques fabrications à la fois.
provides-lease-tooltip=Ce que la planète vous expédie sur toute la durée, une part égale à chaque période, dans les coffres d'import du hub où vous avez pris le créneau ; une partie de chaque expédition peut être perdue en transit.
requires-incoming-tooltip=Produits à remettre dans un coffre de contrat à moins de 10 cases d'un hub avant l'échéance ; une fois accepté, livrés jusqu'ici / exigés.
requires-rental-tooltip=Produits que votre assembleur de location doit fabriquer pour elle ; une fois accepté, prélevés jusqu'ici / promis.
terms-tooltip=Récompense : versée quand chaque unité exigée est livrée à temps (une location de machine verse son loyer toutes les 5 min pour ce qui a été fabriqué, le reste à la fin). Garantie : dépôt plus pénalité, retenus sur vos fonds quand vous acceptez ; elle revient quand le contrat est rempli et est conservée s'il échoue.
charge-terms-tooltip=Redevance : prélevée toutes les 5 min pour chaque période expédiée par la planète ; une période qu'elle ne peut pas expédier (pas de hub ni de coffre d'import) est sautée, gratuitement. Une redevance que vos fonds ne couvrent pas fait échouer le bail. Garantie : la redevance d'une période, retenue quand vous prenez le créneau, rendue à la fin de la durée, conservée si le bail échoue.
offer-ends-tooltip=Une offre non acceptée d'ici là expire ; Refuser la retire maintenant.
due-contract-tooltip=Échéance : chaque unité exigée doit être livrée d'ici là, sinon le contrat échoue, sa garantie est conservée et votre réputation baisse de 1.
due-lease-tooltip=Fin de la durée : une fois sa dernière période facturée, la garantie revient.
due-loan-tooltip=Date de la dernière échéance.
accept-tooltip=Prendre le contrat : sa garantie est retenue sur vos fonds disponibles (découvert compris). Les ingrédients d'un contrat de fabrication sont expédiés dans les coffres d'import du hub de la fenêtre. Refusé tant que vous êtes en cessation de paiement.
decline-tooltip=Refuser l'offre, sans frais.
abandon-tooltip=Mettre fin au contrat maintenant : sauf si chaque unité exigée est déjà livrée, il échoue, sa garantie est conservée et votre réputation baisse de 1.
abandon-lease-tooltip=Mettre fin au bail maintenant : il échoue, sa garantie est conservée et votre réputation baisse de 1.
kind-warehouse=Location d'entrepôt : elle entrepose des marchandises dans un de vos entrepôts de location, les reprend à la fin, puis paie le loyer.
kind-storage=Coffre-fort : de l'espace de stockage que vous lui louez, facturé toutes les __1__ minutes quel que soit son contenu.
