[mod-name]
galactic-bazaar=Galactic Bazaar

[mod-description]
galactic-bazaar=Un marché galactique où chaque flux de l'usine devient un actif échangeable.

[entity-name]
gb-fluid-export=Manifold d'export de fluides
gb-fluid-import=Manifold d'import de fluides
gb-order-combinator=Combinateur d'ordres
gb-buy-price-combinator=Combinateur des prix d'achat
gb-sell-price-combinator=Combinateur des prix de vente
gb-power-export=Sous-station d'export électrique
gb-power-import=Sous-station d'import électrique
gb-export-chest=Coffre d'export
gb-import-chest=Coffre d'import
gb-hub=Hub de négociation

[entity-description]
gb-fluid-export=Vend chaque seconde au marché galactique le fluide qu'il contient, tant qu'il rapporte au moins la moitié de sa valeur de base, via un hub de négociation alimenté à moins de 10 cases.
gb-fluid-import=Reçoit les fluides achetés sur le marché, livrés par capsule orbitale, quand un hub de négociation est à portée.
gb-order-combinator=Lit les signaux d'articles et de fluides sur son entrée logique et, toutes les 10 s, achète autant d'unités de chacun (articles de qualité normale), livrées par capsule orbitale dans les coffres ou manifolds d'import d'un hub de négociation alimenté à moins de 10 cases. N'achète rien sans signal Budget positif, qui plafonne ce que votre force dépense par les combinateurs d'ordres toutes les 10 s. Refuse une entrée portant le signal Crédits des combinateurs de prix.
gb-buy-price-combinator=Émet le prix d'achat d'une unité de chaque article et fluide, en milli-crédits (1,32 crédit = 1320), et le solde de la force en crédits sur le signal Crédits, via un hub de négociation alimenté à moins de 10 cases. Prix rafraîchis environ toutes les 10 s (plus avec beaucoup de combinateurs), solde en quelques secondes.
gb-sell-price-combinator=Émet le prix de vente d'une unité de chaque article et fluide, en milli-crédits (1,32 crédit = 1320), et le solde de la force en crédits sur le signal Crédits, via un hub de négociation alimenté à moins de 10 cases. Prix rafraîchis environ toutes les 10 s (plus avec beaucoup de combinateurs), solde en quelques secondes.
gb-power-export=Vend le surplus du réseau électrique au marché galactique, via un hub de négociation alimenté à moins de 10 cases. Ne se charge que sur le surplus, comme un accumulateur.
gb-power-import=Achète au marché galactique l'électricité qui manque au réseau, via un hub de négociation alimenté à moins de 10 cases. Ne se décharge qu'en cas de manque, comme un accumulateur.
gb-export-chest=Le marché achète ce que vous y déposez, quand un hub de négociation est à portée. Ne vend que si le prix atteint au moins la moitié de la valeur de base.
gb-import-chest=Reçoit les marchandises achetées sur le marché, quand un hub de négociation est à portée.
gb-hub=Bâtiment central du terminal du Galactic Bazaar : ouvre le marché. Les modules s'y rattachent. Nécessite de l'électricité.

