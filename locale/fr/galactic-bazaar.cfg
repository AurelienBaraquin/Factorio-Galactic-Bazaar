[tips-and-tricks-item-description]
gb-galactic-bazaar=Chaque flux de votre usine peut s'échanger sur un marché galactique : vendez ce que vous produisez, achetez ce qui vous manque, prenez des contrats, louez des planètes et empruntez. Ouvrez la fenêtre du Galactic Bazaar avec __CONTROL__gb-toggle-bazaar__ ou le bouton en haut à gauche, et survolez n'importe quel chiffre pour lire la règle qui le gouverne. Les entrées ci-dessous expliquent chaque système à mesure que vous le recherchez.
gb-bazaar-window=Ses onglets : Vue d'ensemble (votre compte, réputation, solvabilité et engagements), Marché (prix, achat et vente, et pourquoi chaque article vaut ce qu'il vaut), Événements (pénuries, excédents et crises du marché), Logistique (vos hubs, les expéditions en vol et les bâtiments rattachés), Contrats, Planètes (après Concessions planétaires) et Relevé (d'où vient et où va chaque crédit).\nChaque onglet se lit partout, même en vue à distance. Acheter, vendre et tout ce qui engage votre force demandent un hub de négociation de votre force à portée de votre personnage : celui que vous avez cliqué, sinon le plus proche.
gb-trading-hub=Le [entity=gb-hub] hub de négociation est votre lien avec le marché et a besoin de courant. Les bâtiments du mod se rattachent au hub de leur force le plus proche à moins de 10 cases, de préférence un hub alimenté. Les [entity=gb-export-chest] coffres d'export vendent ce que vous y déposez tant que chaque unité rapporte au moins la moitié de sa valeur de base ; les [entity=gb-import-chest] coffres d'import reçoivent vos achats. Les manifolds de fluides (Négoce de fluides) font de même pour les fluides, et la catapulte électromagnétique vend d'un seul tir tout ce qu'elle contient, au plus toutes les 2 s, pour 50 MJ.\nChaque bâtiment affiche un état quand vous le survolez, et une icône quand il est arrêté : pas de hub à portée, ou pas de courant.
gb-prices=La valeur de base d'un article vient de ce qu'il faut pour le fabriquer : sa recette la moins chère, la valeur de ses ingrédients et son temps de fabrication, jusqu'aux ressources extraites. Le prix moyen du marché part de là : acheter laisse le marché en pénurie et le fait monter, vendre lui laisse un excédent et le fait baisser, et sans échange l'écart diminue de moitié toutes les 10 minutes. Les autres marchands déplacent aussi chaque marché un peu chaque minute.\nVous payez le prix moyen plus la moitié de l'écart achat-vente de 10 % et recevez le prix moyen moins la moitié : acheter puis revendre aussitôt fait perdre l'écart. Chaque unité d'un gros ordre fait bouger le prix, aussi l'aperçu montre-t-il le coût de l'ordre entier.
gb-deliveries=Un achat est payé aussitôt, avec des frais de fret, et arrive dans les coffres d'import (fluides : manifolds d'import) de son hub. Il part par le meilleur palier que fournissent les bâtiments du hub, qui a de la place dans sa file et de quoi assurer la commande, jusqu'à la capsule orbitale :\n- capsule orbitale, toujours : arrive 30 s après son lancement, un lancement toutes les 10 s, 10 piles, 5 % de frais ;\n- navette cargo, tant qu'une baie d'amarrage a le combustible nécessaire : 20 s, toutes les 5 s, 40 piles, 3 % ;\n- téléporteur, tant qu'un téléporteur est alimenté : 1 s, chaque seconde, 20 piles, 1 %.\nChaque palier met en file au plus 20 expéditions par hub, et votre réputation module les frais. L'onglet Logistique montre ce qui est en vol et pourquoi une expédition attend.
gb-account=Votre force a un seul solde, partagé par ses joueurs. Il peut passer sous zéro, jusqu'à la limite de découvert : 10 000 crédits, 25 000 avec Découvert 1 et 100 000 avec Découvert 2 (moins avec une réputation négative). Chaque minute, un solde passé sous zéro paie 0,5 % de son point le plus bas, la dette comptée jusqu'à la limite. L'onglet Relevé liste chaque transaction et les totaux de chaque catégorie.
gb-insolvency=Au-delà de la limite de découvert, ou en devant des arriérés que vous ne pouvez pas payer, votre force est en cessation de paiement : aucun contrat ni prêt n'est accepté. Dans les 10 minutes, ramenez le solde jusqu'à ce qu'il reste 5 % de la limite (−9 500 pour 10 000), sans arriérés, puis tenez-le ainsi une minute entière, qui peut finir après les 10 minutes ; une baisse fait recommencer la minute. Sinon, c'est la faillite.\nUne faillite met fin à chaque contrat ouvert (garanties conservées), transforme tout ce qui est dû plus 25 % en une dette gelée que chaque crédit reçu rembourse d'abord, met votre réputation à −20, et refuse prêts et découvert pendant 60 minutes (doublées à chaque nouvelle faillite, jusqu'à 8 heures) et tant que cette dette n'est pas remboursée.
gb-research=La recherche se fait dans vos propres laboratoires ; les packs de science s'achètent sur le marché comme tout article. Les Télécommunications galactiques rendent les prix que vous voyez plus frais : toutes les 30 s, puis 10 s, puis 2 s avec historique et tendances ; ce que vous payez ou recevez est toujours le prix en direct. Les autres recherches du mod débloquent ses bâtiments, contrats, planètes et le crédit : chaque description dit ce qu'elle fait.
gb-alerts=Le mod lève des alertes, la plupart avec une ligne de discussion, pour les offres de contrat, les contrats dus dans les 2 minutes, les contrats remplis ou échoués, les expéditions arrivées (au plus une alerte par hub toutes les 30 s), un prêt en défaut, la cessation de paiement, le rétablissement, la faillite, le crédit rétabli et les événements du marché (annoncés, commencés, annulés, terminés). Désactivez chaque groupe pour vous seul dans Paramètres → Paramètres des mods → Par joueur ; les lignes de discussion de cessation de paiement et de faillite s'affichent même alors.
gb-power-trading=Les [entity=gb-power-export] sous-stations d'export vendent le surplus d'électricité de votre réseau, les [entity=gb-power-import] sous-stations d'import achètent ce qui lui manque : 10 MW chacune, 40 MW avec Négoce d'électricité 2 ; le règlement a lieu toutes les 5 s, par un hub alimenté à moins de 10 cases. L'électricité est évaluée d'après le combustible qu'il faut pour la produire ; les exports s'arrêtent tant qu'elle rapporte moins de la moitié de cette valeur.
gb-circuits=Les [entity=gb-buy-price-combinator] combinateurs de prix émettent, par un hub alimenté à moins de 10 cases, le prix de chaque objet et fluide en millicrédits (1,32 crédit donne 1320) et votre solde sur le signal Crédits. Le [entity=gb-order-combinator] combinateur d'ordres (Ordres de marché) achète, toutes les 10 s, les unités que demandent ses signaux d'objets et de fluides, en dépensant au plus son signal Budget par 10 s ; n'y reliez jamais un combinateur de prix.
gb-contracts=Toutes les 5 minutes, jusqu'à 3 à la fois, une contrepartie vous propose de fabriquer une recette que vous connaissez. Acceptez-la dans les 5 minutes dans l'onglet Contrats : une garantie (dépôt plus pénalité) est retenue, et les ingrédients arrivent gratuitement par capsule orbitale. Déposez les produits dans un [entity=gb-contract-chest] coffre de contrat à moins de 10 cases d'un hub avant l'échéance : vous touchez la récompense et récupérez la garantie, et +1 de réputation. En retard ou abandonné, la garantie est conservée et votre réputation baisse de 1. Tant qu'un événement de marché rend des biens rares, la moitié des offres demandent une recette qui les fabrique. Au plus 8 contrats, baux et prêts sont ouverts à la fois.
gb-reputation=De −20 à 20, elle part de 0. Un contrat rempli en livrant ce qu'il exige la fait monter de 1 (louer vos machines ou entrepôts ne la fait pas monter), un échec la fait baisser de 1, et une faillite la met à −20. Chaque point baisse vos frais de fret de 2,5 % (×0,5 à 20, ×1,5 à −20) et agrandit les offres de contrats de fabrication de 10 % (×3 à 20, jamais moins de moitié) ; elle fixe aussi le taux des prêts et ce que vous pouvez emprunter, et un score négatif réduit ce qu'ajoutent les recherches de découvert.
gb-rental=Toutes les 5 minutes, chaque [entity=gb-rental-assembler] assembleur de location inactif à moins de 10 cases d'un hub est proposé à la location dans l'onglet Contrats. Une fois accepté, il fabrique la recette de la contrepartie pendant 30 minutes avec les ingrédients qu'elle fournit, et doit produire 80 % de ce qu'il ferait à pleine vitesse ; le loyer, 0,5 crédit par seconde de fabrication promise quelle que soit la recette, est versé toutes les 5 minutes pour ce qu'il a produit, et la location ne rapporte pas de réputation. Gardez-le alimenté, et ne sortez jamais ses produits avec un bras robotisé : ils ne compteraient pas.
gb-planets=L'onglet Planètes liste les planètes PNJ de la galaxie : leurs minerais et fabrications, leur distance, et les créneaux libres pour votre force (chaque force a les siens). Louez un minerai : pendant 30 minutes la planète expédie 150 unités toutes les 5 minutes dans les coffres d'import de votre hub, chaque expédition facturée à la valeur de base du minerai, la redevance d'une période retenue en garantie. Chaque unité de transit ajoute 1 minute à l'arrivée et jusqu'à 2 % de perte sur chaque expédition, au plus 25 %.
gb-outsourcing=Sur une ligne de fabrication de l'onglet Planètes, choisissez une de vos recettes débloquées avec un seul produit certain et réservez-la : pendant 30 minutes la planète achète les ingrédients, fabrique comme une machine de vitesse 1 et expédie les produits toutes les 5 minutes, chaque expédition facturée à 105 % de leur valeur de base, aux autres conditions d'une concession minière.
gb-loans=Empruntez 5 000, 20 000 ou 100 000 crédits depuis l'onglet Contrats, remboursés en 12 échéances, une toutes les 5 minutes. L'intérêt sur l'heure est de 10 % à une réputation de 0 (5 % à 20, 15 % à −20), et votre dette de prêts ne peut dépasser 50 000 crédits à une réputation de 0 (×3 à 20, la moitié dès −5). Rembourser paie d'un coup toutes les échéances restantes. Une échéance que vos fonds ne couvrent pas fait tomber le prêt en défaut : réputation −1, et le reste devient des arriérés prélevés sur vos fonds dès qu'ils le permettent.
gb-quality=Chaque qualité vaut la valeur normale fois 3 à la puissance de son niveau (légendaire, niveau 5 : ×243), et son marché est aussi profond en unités que le normal. Les coffres d'export vendent chaque qualité à son propre prix ; la fenêtre et les combinateurs d'ordres n'échangent que la qualité normale.
gb-space-age=Vulcanus, Fulgora, Gleba et Aquilo rejoignent les planètes PNJ avec leurs propres minerais et fabrications phares, et ne fabriquent que les recettes qu'elles pourraient accueillir. Les biens périssables se vendent au prix du marché fois leur fraîcheur. Les assembleurs de location ne se voient proposer que des recettes que leur surface permet.
gb-storage-rental=Le stockage se loue dans les deux sens. Louez un coffre-fort depuis l'onglet Contrats à un hub : 50 piles pendant 30 minutes, 150 crédits toutes les 5 minutes, une période retenue en garantie. Mettez des marchandises dans une [entity=gb-vault-uplink] liaison de coffre-fort à moins de 10 cases de ce hub et elles partent dans le coffre-fort ; Récupérer les renvoie par capsule orbitale, et elles reviennent d'elles-mêmes à la fin du coffre-fort. Une redevance impayée fait échouer le coffre-fort (garantie conservée, réputation −1), mais vos marchandises vous sont toujours rendues.\nToutes les 5 minutes, chaque [entity=gb-rental-warehouse] entrepôt de location vide à moins de 10 cases d'un hub est proposé à une contrepartie, qui y entrepose des marchandises pendant 30 minutes et paie 2 crédits par pile et par période quand elle les reprend toutes. Ne les sortez jamais : une unité manquante fait échouer le contrat.
gb-market-events=De temps à autre, la galaxie connaît une pénurie (les acheteurs d'un bien paient plus, et on peut en acheter moins), un excédent (les vendeurs d'un bien reçoivent moins) ou une crise (une pénurie sur toute une famille de biens). Environ la moitié sont annoncés 5 minutes à l'avance, et un quart des prévisions sont annulées ; le cours d'un événement est incertain et il peut finir plus tôt. Un événement ne fait jamais qu'empirer un prix : les vendeurs reçoivent toujours le prix habituel lors d'une pénurie, et les acheteurs paient toujours le prix habituel lors d'un excédent, si bien qu'aucun échange ne fait mieux avec un événement que sans. Ce sont des risques : fabriquez ce qui manque plutôt que de l'acheter, et gardez ce qui est en excédent plutôt que de le vendre. Un événement dure au plus 10 à 30 minutes, puis s'estompe, diminuant de moitié toutes les 10 minutes. L'onglet Événements les liste et le détail d'article de l'onglet Marché montre ce qu'ils ajoutent à un prix ; les administrateurs règlent leur fréquence et leur ampleur dans Paramètres → Paramètres des mods → Carte.
