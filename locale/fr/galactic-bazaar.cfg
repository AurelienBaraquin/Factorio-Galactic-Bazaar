[mod-setting-description]
gb-value-multiplier=Multiplie toutes les valeurs de base, donc tous les prix. Les valeurs fixées par d'autres mods via l'interface remote restent telles qu'ils les ont fixées.
gb-notify-contracts=Alertes et lignes de discussion pour les nouvelles offres de contrat, les contrats dont l'échéance tombe dans les 2 minutes, et les contrats remplis ou échoués.
gb-notify-deliveries=Alertes à l'arrivée d'envois à un hub de négociation (au plus une par hub toutes les 30 secondes, comptant chaque envoi depuis la précédente).
gb-notify-finance=Alertes et lignes de discussion pour un prêt en défaut, la cessation de paiement, le retour à la solvabilité, la faillite et le crédit rétabli. Les messages de cessation de paiement et de faillite restent toujours affichés dans la discussion.
gb-notify-market=Alertes et lignes de discussion quand un événement du marché est annoncé, commence, est annulé ou se termine.
gb-market-events-frequency=Fréquence des tirages de pénuries, excédents et crises : à 1, un tirage toutes les 15 à 45 minutes (environ deux événements par heure) ; 0 les désactive ; à 4, un toutes les 3:45 à 11:15 (environ sept par heure, moins quand trois sont en cours). Un changement attend le tirage déjà prévu.
gb-market-events-magnitude=Jusqu'où un événement peut déplacer les prix : multiplie sa première poussée et la fourchette de son cours (à 1, une pénurie peut faire monter ce que paient les acheteurs jusqu'à 348 %). S'applique aux événements tirés ensuite.

