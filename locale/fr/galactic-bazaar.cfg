tier-shuttle=navette cargo
tier-teleporter=téléporteur
cost-with-freight=__1__ crédits (fret de __2__ compris, par __3__)
refused-no-import-chest=Ce hub n'a aucun coffre d'import de votre force à portée pour recevoir la livraison.
refused-queue-full=Trop d'envois déjà en file pour le palier de livraison de ce hub : commandez moins, ou attendez.
ordered=__1__ × __2__ commandés pour __3__ crédits plus __4__ de fret ; le dernier envoi arrive dans __5__ s.
hub-tooltip=Le hub de négociation par lequel cette fenêtre négocie : celui que vous avez cliqué, sinon le hub de votre force le plus proche à portée de votre personnage (jamais en vue à distance). Acheter et vendre en ont besoin, alimenté ; les prix se lisent partout.
column-item-tooltip=Chaque objet et fluide qui a une valeur de base. Cliquez une icône pour voir son détail à côté de la liste : ses prix, la règle derrière chaque chiffre et pourquoi il vaut sa valeur de base.
column-buy-tooltip=Ce que vous coûte la prochaine unité : le prix moyen plus la moitié de l'écart (__1__ %). Chaque unité d'un gros ordre coûte un peu plus que la précédente, et un achat ajoute les frais de fret. Ce sont les prix que voit votre force, rafraîchis toutes les __2__ s (__3__ s avec Télécommunications galactiques 1, __4__ s avec le niveau 2).
column-sell-tooltip=Ce que le marché vous paie pour la prochaine unité : le prix moyen moins la moitié de l'écart (__1__ %). Chaque unité d'un gros ordre rapporte un peu moins que la précédente ; une vente ne paie pas de fret. Ce sont les prix que voit votre force, rafraîchis toutes les __2__ s (__3__ s avec Télécommunications galactiques 1, __4__ s avec le niveau 2).
column-trend-tooltip=Comment le prix moyen a évolué sur son historique, les __1__ derniers pas des PNJ (un toutes les __2__ min) : ▲ en hausse ou ▼ en baisse de plus de __3__ %, – sinon. Affichée avec Télécommunications galactiques 2.
quantity-tooltip=Nombre entier d'unités à acheter ou vendre, de 1 à __1__. L'aperçu et l'impact de l'ordre ci-dessous suivent ce que vous saisissez.
buy-tooltip=Acheter la quantité au prix en direct, payée aussitôt avec les frais de fret indiqués par l'aperçu. Elle est livrée dans les coffres d'import (fluides : manifolds d'import) du hub de la fenêtre, par le palier de livraison que nomme l'aperçu.
sell-tooltip=Vendre la quantité depuis votre inventaire au prix en direct : qualité normale seulement, piles intactes, inutilisées et sans données, tant que chaque unité rapporte au moins __1__ % de sa valeur de base. Les fluides se vendent par les manifolds d'export.
preview-tooltip=Prix en direct pour toute la quantité, chaque unité faisant bouger le prix (voir l'impact de l'ordre ci-dessous), et non les prix vus dans la liste. L'achat ajoute les frais de fret : la part du coût de marché que prend le palier de livraison, multipliée par le facteur de frais de votre réputation (survolez la ligne Livraison). Les biens périssables vendus depuis votre inventaire rapportent le prix multiplié par leur fraîcheur.
search-tooltip=Affiche les objets et fluides dont le nom interne contient chaque mot saisi, dans n'importe quel ordre et sans tenir compte de la casse ; espaces, tirets et tirets bas séparent les mots.
page-tooltip=__1__ articles par page ; < et > tournent les pages.

