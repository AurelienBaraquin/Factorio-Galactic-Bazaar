[technology-description]
gb-credit=L'Union de crédit galactique prête à votre force : des prêts de 5 000, 20 000 ou 100 000 crédits depuis la fenêtre des contrats, remboursés avec intérêts en une heure.
gb-overdraft-1=Votre solde peut descendre plus bas sous zéro : la limite de découvert passe de 10 000 à 25 000 crédits.
gb-overdraft-2=La limite de découvert passe à 100 000 crédits.
gb-planetary-concessions=Ouvre les planètes PNJ de la galaxie : la fenêtre des planètes et les concessions minières sur leurs minerais.
gb-outsourcing=Les planètes PNJ fabriquent vos recettes dans leurs fonderies et assembleurs, en achetant elles-mêmes les ingrédients.
gb-capacity-rental=Des contreparties louent vos assembleurs de location à la demi-heure et paient par versements ce qu'elles produisent.
gb-contracts=Des contreparties vous proposent de fabriquer pour elles : elles livrent les ingrédients, vous rendez les produits avant l'échéance contre une récompense.
gb-catapult=Une catapulte qui vend son contenu en vrac, bien plus vite que les coffres d'export, contre beaucoup d'énergie.
gb-teleporter=Un téléporteur qui donne à votre hub des livraisons quasi instantanées, à débit élevé mais borné, contre une consommation électrique constante.
gb-cargo-shuttle=Une baie d'amarrage qui donne des navettes cargo à votre hub : plus de capacité, plus rapide, fret moins cher, contre du carburant.
gb-fluid-trading=Des manifolds qui vendent des fluides au marché et reçoivent les fluides achetés.
gb-telecommunications-1=Un flux de cotations plus rapide : les prix que vous voyez se rafraîchissent toutes les 10 s au lieu de 30 s.
gb-telecommunications-2=Un flux de cotations en temps réel : prix rafraîchis toutes les 2 s, avec historique et tendances.
gb-market-orders=Un combinateur qui passe des ordres d'achat à partir des signaux logiques.
gb-market-signals=Des combinateurs qui émettent les prix du marché et votre solde sur le réseau logique.
gb-power-trading=Des sous-stations qui vendent le surplus d'électricité et achètent ce qui manque au réseau : 10 MW chacune.
gb-power-trading-2=Porte le débit de chaque sous-station à 40 MW.
gb-galactic-bazaar=Accès au marché galactique : débloque le hub de négociation, le module cargo et la livraison par capsule orbitale.

