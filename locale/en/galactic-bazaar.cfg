[technology-description]
gb-credit=The Galactic Credit Union lends to your force: loans of 5 000, 20 000 or 100 000 credits from the Contracts tab, repaid with interest over an hour.
gb-overdraft-1=Your balance may go further below zero: the overdraft limit rises from 10 000 to 25 000 credits.
gb-overdraft-2=The overdraft limit rises to 100 000 credits.
gb-planetary-concessions=Opens the galaxy's NPC planets: the Planets tab and mining concessions on their ores.
gb-outsourcing=NPC planets craft your recipes in their foundries and assemblers, buying the ingredients themselves.
gb-capacity-rental=Counterparties rent your rental assemblers by the half hour and pay in installments for what they produce.
gb-contracts=Counterparties offer you to craft for them: they ship the ingredients, you return the products before the deadline for a reward.
gb-catapult=A catapult that sells everything it holds in one shot, at most every 2 s, far faster than export chests, for 50 MJ a shot.
gb-teleporter=A teleporter that gives your trading hub near-instant deliveries (1 s, 1 % freight) with a high but bounded throughput, for a constant 20 MW.
gb-cargo-shuttle=A docking bay that gives your trading hub cargo shuttles: 40 stacks every 5 s, landing in 20 s, 3 % freight, for 100 MJ of chemical fuel a shipment.
gb-fluid-trading=Manifolds that sell fluids to the market and receive the fluids you buy.
gb-telecommunications-1=A faster market feed: prices you see refresh every 10 s instead of 30 s.
gb-telecommunications-2=A real-time market feed: prices refresh every 2 s, with price history and trends.
gb-market-orders=A combinator that buys, every 10 s, the items and fluids its circuit signals ask for, within the Budget signal it receives.
gb-market-signals=Combinators that emit market prices, in milli-credits, and your balance on the circuit network.
gb-power-trading=Substations that sell surplus electricity and buy what the network lacks: 10 MW each.
gb-power-trading-2=Raises each substation's throughput to 40 MW.
gb-galactic-bazaar=Access to the galactic market: the Galactic Bazaar window (__CONTROL__gb-toggle-bazaar__), the trading hub, export and import chests, and delivery by orbital capsule. See Tips and tricks for how each part of the market works.
gb-storage-rental=Rent storage both ways: vaults from NPCs, filled through vault uplinks and emptied on demand, and your rental warehouses to counterparties who store goods in them for a rent.

