[technology-description]
gb-credit=The Galactic Credit Union lends to your force: loans of 5 000, 20 000 or 100 000 credits from the contracts window, repaid with interest over an hour.
gb-overdraft-1=Your balance may go further below zero: the overdraft limit rises from 10 000 to 25 000 credits.
gb-overdraft-2=The overdraft limit rises to 100 000 credits.
gb-planetary-concessions=Opens the galaxy's NPC planets: the Planets window and mining concessions on their ores.
gb-outsourcing=NPC planets craft your recipes in their foundries and assemblers, buying the ingredients themselves.
gb-capacity-rental=Counterparties rent your rental assemblers by the half hour and pay in installments for what they produce.
gb-contracts=Counterparties offer you to craft for them: they ship the ingredients, you return the products before the deadline for a reward.
gb-catapult=A catapult that sells its contents in bulk, far faster than export chests, for massive amounts of energy.
gb-teleporter=A teleporter that gives your trading hub near-instant deliveries with a high but bounded throughput, for a constant power draw.
gb-cargo-shuttle=A docking bay that gives your trading hub cargo shuttles: more capacity, faster, cheaper freight, for fuel.
gb-fluid-trading=Manifolds that sell fluids to the market and receive the fluids you buy.
gb-telecommunications-1=A faster market feed: prices you see refresh every 10 s instead of 30 s.
gb-telecommunications-2=A real-time market feed: prices refresh every 2 s, with price history and trends.
gb-market-orders=A combinator that places buy orders from circuit signals.
gb-market-signals=Combinators that emit market prices and your balance on the circuit network.
gb-power-trading=Substations that sell surplus electricity and buy what the network lacks: 10 MW each.
gb-power-trading-2=Raises each substation's throughput to 40 MW.
gb-galactic-bazaar=Access to the galactic market: unlocks the trading hub, the cargo module and delivery by orbital capsule.

