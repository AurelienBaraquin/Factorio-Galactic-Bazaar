[mod-setting-description]
gb-value-multiplier=Scales every base value, and so every price. Values fixed by other mods through the remote interface stay as they set them.
gb-notify-contracts=Alerts and chat lines for new contract offers, contracts due within 2 minutes, and contracts fulfilled or failed.
gb-notify-deliveries=Alerts when shipments land at a trading hub (at most one per hub every 30 seconds, counting every shipment since the last one).
gb-notify-finance=Alerts and chat lines for a loan default, insolvency, recovery, bankruptcy and credit restored. The insolvency and bankruptcy chat lines are always shown.

