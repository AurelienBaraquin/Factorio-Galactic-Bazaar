vault-refused-no-import-chest=The hub has no import chest of your force within 10 tiles: a vault is rented at a hub with one, and retrieved only to its own hub.
vault-refused-too-many-contracts=Your Contracts tab is full (8 contracts): end one before renting a vault.
vault-refused-insolvent=You are insolvent: no vault is rented until you recover.
vault-refused-insufficient-funds=Not enough credits to put up the guarantee.
