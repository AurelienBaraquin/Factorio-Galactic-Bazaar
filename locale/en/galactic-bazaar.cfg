terms-tooltip=Reward: paid when every required unit is delivered in time (a machine rental pays its rent every 5 min for what was made, the rest at the end). Guarantee: deposit plus penalty, held from your funds when you accept; it comes back when the contract is fulfilled and is kept if it fails.
charge-terms-tooltip=Charge: taken every 5 min for each period the planet ships; a period it cannot ship (no hub or import chest) is skipped, free. A charge your funds cannot cover makes the lease fail. Guarantee: one period's charge, held when you take the slot, back at the end of the term, kept if the lease fails.
