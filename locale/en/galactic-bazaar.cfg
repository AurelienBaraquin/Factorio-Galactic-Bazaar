[mod-name]
galactic-bazaar=Galactic Bazaar

[mod-description]
galactic-bazaar=A galactic market where every flow of the factory is a tradable asset.

[entity-name]
gb-order-combinator=Order combinator
gb-buy-price-combinator=Buy price combinator
gb-sell-price-combinator=Sell price combinator
gb-power-export=Power export substation
gb-power-import=Power import substation
gb-export-chest=Export chest
gb-import-chest=Import chest
gb-hub=Trading hub

[entity-description]
gb-order-combinator=Reads item signals on its circuit input and, every 10 s, buys that many units of each (normal quality), delivered by orbital capsule to the import chests of a powered trading hub within 10 tiles. Spends at most the Credits signal's value per 10 s, or a tenth of the balance without it.
gb-buy-price-combinator=Emits the market price to buy one unit of every item and fluid, in milli-credits (1.32 credits = 1320), and the force's balance in credits on the Credits signal, through a powered trading hub within 10 tiles. Prices refresh about every 10 s (longer with many combinators), the balance within seconds.
gb-sell-price-combinator=Emits the market price paid for one unit of every item and fluid, in milli-credits (1.32 credits = 1320), and the force's balance in credits on the Credits signal, through a powered trading hub within 10 tiles. Prices refresh about every 10 s (longer with many combinators), the balance within seconds.
gb-power-export=Sells the electric network's surplus to the galactic market, through a powered trading hub within 10 tiles. Charges only from surplus, like an accumulator.
gb-power-import=Buys the electricity the network lacks from the galactic market, through a powered trading hub within 10 tiles. Discharges only on shortage, like an accumulator.
gb-export-chest=The market buys what you put in it, when a trading hub is in range. Sells only while the price is at least half the base value.
gb-import-chest=Receives the goods you buy on the market, when a trading hub is in range.
gb-hub=Central building of the Galactic Bazaar terminal: opens the market. Modules attach to it. Needs power.

