[entity-description]
gb-rental-assembler=Rented out to counterparties: it crafts only what a rental contract asks, with ingredients they supply and products they take. You provide the power. Needs a trading hub within 10 tiles.
gb-contract-chest=Products put in it are handed over to your open incoming contracts, oldest first, when a trading hub is within 10 tiles.
gb-catapult=Sells everything it holds to the galactic market in one shot, at most every 2 s, while each unit fetches at least half its base value. Each shot draws 50 MJ from the electric network; without it, no shot. Needs a powered trading hub within 10 tiles.
gb-teleporter=Draws 20 MW. While powered, the trading hub within 10 tiles delivers by teleporter: 20 stacks every second, landing in 1 s, 1 % freight. Without power, its shipments wait.
gb-docking-bay=Holds chemical fuel. While it holds enough, the trading hub within 10 tiles delivers by cargo shuttle: 40 stacks every 5 s, landing in 20 s, 3 % freight. Each shuttle burns 100 MJ (one rocket fuel); an order the fuel cannot cover goes by orbital capsule.
gb-fluid-export=Sells the fluid it holds to the galactic market every second, while it fetches at least half its base value, through a powered trading hub within 10 tiles.
gb-fluid-import=Receives the fluids you buy on the market, delivered by the hub's delivery tier, when a trading hub is in range.
gb-order-combinator=Reads item and fluid signals on its circuit input and, every 10 s, buys that many units of each (items of normal quality), delivered by the hub's delivery tier to the import chests or import manifolds of a powered trading hub within 10 tiles. Buys nothing without a positive Budget signal, which caps what your force spends through order combinators per 10 s. Refuses an input carrying the Credits or Price feed signal of price combinators.
gb-buy-price-combinator=Emits the market price to buy one unit of every item and fluid, in milli-credits (1.32 credits = 1320), and the force's balance in credits on the Credits signal (and 1 on the Price feed signal), through a powered trading hub within 10 tiles. Prices refresh about every 10 s (longer with many combinators), the balance within seconds.
gb-sell-price-combinator=Emits the market price paid for one unit of every item and fluid, in milli-credits (1.32 credits = 1320), and the force's balance in credits on the Credits signal (and 1 on the Price feed signal), through a powered trading hub within 10 tiles. Prices refresh about every 10 s (longer with many combinators), the balance within seconds.
gb-power-export=Sells the electric network's surplus to the galactic market, through a powered trading hub within 10 tiles. Charges only from surplus, like an accumulator.
gb-power-import=Buys the electricity the network lacks from the galactic market, through a powered trading hub within 10 tiles. Discharges only on shortage, like an accumulator.
gb-export-chest=The market buys what you put in it, when a trading hub is in range. Sells only while the price is at least half the base value.
gb-import-chest=Receives the goods you buy on the market, when a trading hub is in range.
gb-hub=Central building of the Galactic Bazaar terminal: opens the market. Modules attach to it. Needs power.

