[tips-and-tricks-item-description]
gb-galactic-bazaar=Every flow of your factory can be traded on a galactic market: sell what you make, buy what you lack, take contracts, lease planets and borrow. Open the Galactic Bazaar window with __CONTROL__gb-toggle-bazaar__ or the button at the top left, and hover any figure in it to read the rule behind it. The entries below explain each system as you research it.
gb-bazaar-window=Its tabs: Overview (your account, reputation, solvency and commitments), Market (prices, buying and selling, and why each item is worth what it is), Logistics (your hubs, shipments in flight and attached buildings), Contracts, Planets (after Planetary concessions) and Statement (where every credit came from and went to).\nEvery tab can be read anywhere, even from remote view. Buying, selling and anything that commits your force need a trading hub of your force within reach of your character: the one you clicked, or else the nearest.
gb-trading-hub=The [entity=gb-hub] trading hub is your link to the market and needs power. The mod's buildings attach to the nearest hub of their force within 10 tiles, preferring one with power. [entity=gb-export-chest] Export chests sell what you put in them while each unit fetches at least half its base value; [entity=gb-import-chest] import chests receive your purchases. Fluid manifolds (Fluid trading) do the same for fluids, and the electromagnetic catapult sells everything it holds in one shot, at most every 2 s, for 50 MJ.\nEvery building shows a status when you hover it, and an icon when it is stopped: no hub in range, or no power.
gb-prices=An item's base value comes from what it takes to make it: its cheapest recipe, its ingredients' values and its crafting time, down to mined resources. The market's mid price starts there: buying leaves the market short and raises it, selling leaves a surplus and lowers it, and without trades the gap halves every 10 minutes. Other traders also move each market a little every minute.\nYou pay the mid price plus half the 10 % spread and receive it minus half: buying and selling back at once loses the spread. Each unit of a large order moves the price, so the preview shows the whole order's cost.
gb-deliveries=A purchase is paid at once, with a freight fee, and lands in the import chests (fluids: import manifolds) of its hub. It ships by the best tier the hub's buildings provide that has room in its queue and can supply the order, down to the orbital capsule:\n- orbital capsule, always: lands 30 s after launch, one launch every 10 s, 10 stacks, 5 % fee;\n- cargo shuttle, while a docking bay holds the fuel for it: 20 s, every 5 s, 40 stacks, 3 %;\n- teleporter, while one is powered: 1 s, every second, 20 stacks, 1 %.\nEach tier queues at most 20 shipments per hub, and your reputation scales the fee. The Logistics tab shows what is in flight and why a shipment waits.
gb-account=Your force has one balance, shared by its players. It may go below zero, down to the overdraft limit: 10 000 credits, 25 000 with Overdraft 1 and 100 000 with Overdraft 2 (less with a negative reputation). Every minute a balance that went below zero pays 0.5 % of its lowest point, the debt counted up to the limit. The Statement tab lists every transaction and the totals of each category.
gb-insolvency=Past the overdraft limit, or owing arrears you cannot pay, your force is insolvent: no contract or loan is accepted. Within 10 minutes, bring the balance back until 5 % of the limit is left (−9 500 at 10 000), with no arrears, then hold it there for a whole minute, which may end after the 10 minutes; a dip restarts the minute. Otherwise you go bankrupt.\nA bankruptcy ends every open contract (guarantees kept), turns everything owed plus 25 % into a frozen debt that every credit you receive repays first, sets your reputation to −20, and refuses loans and the overdraft for 60 minutes (doubled at each new bankruptcy, up to 8 hours) and until that debt is repaid.
gb-research=Research runs in your own labs; science packs can be bought on the market like any item. Galactic telecommunications makes the prices you see fresher: every 30 s, then 10 s, then 2 s with price history and trends; what you pay or receive is always the live price. The mod's other researches unlock its buildings, contracts, planets and credit: each description says what it does.
gb-alerts=The mod raises alerts, most with a chat line, for contract offers, contracts due within 2 minutes, contracts fulfilled or failed, shipments landed (at most one alert per hub every 30 s), a defaulted loan, insolvency, recovery, bankruptcy and credit restored. Turn each group off for yourself in Settings → Mod settings → Per player; the insolvency and bankruptcy chat lines are printed even then.
gb-power-trading=[entity=gb-power-export] Export substations sell your network's surplus electricity, [entity=gb-power-import] import substations buy what it lacks: 10 MW each, 40 MW with Power trading 2, settled every 5 s through a powered hub within 10 tiles. Electricity is valued from the fuel it takes to make it; exports stop while it fetches less than half that value.
gb-circuits=[entity=gb-buy-price-combinator] Price combinators emit, through a powered hub within 10 tiles, the price of every item and fluid in milli-credits (1.32 credits reads 1320) and your balance on the Credits signal. [entity=gb-order-combinator] The order combinator (Market orders) buys, every 10 s, the units its item and fluid signals ask for, spending at most its Budget signal per 10 s; never wire a price combinator into it.
gb-contracts=Every 5 minutes, up to 3 at a time, a counterparty offers you to craft a recipe you know. Accept it within 5 minutes in the Contracts tab: a guarantee (deposit plus penalty) is held, and the ingredients arrive free by orbital capsule. Put the products in a [entity=gb-contract-chest] contract chest within 10 tiles of a hub before the deadline: you get the reward and the guarantee back, and +1 reputation. Late or abandoned, the guarantee is kept and your reputation drops by 1. At most 8 contracts, leases and loans are open at a time.
gb-reputation=From −20 to 20, starting at 0. A contract fulfilled by delivering what it requires raises it by 1, one that fails lowers it by 1, and a bankruptcy sets it to −20. Each point lowers your freight fees by 2.5 % (×0.5 at 20, ×1.5 at −20) and makes crafting contract offers 10 % larger (×3 at 20, never below half); it also sets loan rates and how much you may borrow, and a negative score shrinks what the overdraft researches add.
gb-rental=Every 5 minutes, each idle [entity=gb-rental-assembler] rental assembler within 10 tiles of a hub is offered for rent in the Contracts tab. Once accepted, it crafts the counterparty's recipe for 30 minutes from ingredients they supply, and must make 80 % of what it would at full speed; rent is paid every 5 minutes for what it made. Keep it powered, and never take its products out with an inserter: they would not count.
gb-planets=The Planets tab lists the galaxy's NPC planets: their ores and crafts, how far they are, and the slots free for your force (each force has its own). Lease an ore: for 30 minutes the planet ships 150 units every 5 minutes to the import chests of your hub, each shipment charged at the ore's base value, one period's charge held as a guarantee. Each transit unit of distance adds 1 minute to the landing and up to 2 % of each shipment lost on the way, at most 25 %.
gb-outsourcing=On a crafting row of the Planets tab, pick one of your unlocked recipes with a single sure product and book it: for 30 minutes the planet buys the ingredients, crafts as one machine of speed 1 would and ships the products every 5 minutes, each shipment charged at 105 % of their base value, otherwise on a mining concession's terms.
gb-loans=Borrow 5 000, 20 000 or 100 000 credits from the Contracts tab, repaid in 12 installments, one every 5 minutes. Interest over the hour is 10 % at reputation 0 (5 % at 20, 15 % at −20), and your loan debt may not exceed 50 000 credits at reputation 0 (×3 at 20, half from −5). Repay pays every installment left at once. An installment your funds cannot cover defaults the loan: reputation −1, and what is left becomes arrears taken from your funds as they allow.
gb-quality=Each quality is worth the normal value times 3 to the power of its level (legendary, level 5: ×243), and its market is as deep in units as the normal one. Export chests sell every quality at its own price; the window and order combinators trade normal quality only.
gb-space-age=Vulcanus, Fulgora, Gleba and Aquilo join the NPC planets with their own ores and signature crafts, and only craft recipes they could host. Spoilable goods sell at the market price times their freshness. Rental assemblers are only offered recipes their surface allows.
gb-storage-rental=Storage rents both ways. Rent a vault from the Contracts tab at a hub: 50 stacks for 30 minutes, 150 credits every 5 minutes, one period held as a guarantee. Put goods in a [entity=gb-vault-uplink] vault uplink within 10 tiles of that hub and they go into the vault; Retrieve ships them back by orbital capsule, and they come back by themselves when the vault ends. A charge you cannot pay fails the vault (guarantee kept, reputation −1), but your goods are always returned.\nEvery 5 minutes, each empty [entity=gb-rental-warehouse] rental warehouse within 10 tiles of a hub is offered to a counterparty, who stores goods in it for 30 minutes and pays 2 credits per stack and period when it takes them all back. Never take them out: a missing unit fails the contract.
