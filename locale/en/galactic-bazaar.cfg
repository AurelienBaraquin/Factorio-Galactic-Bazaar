accept-tooltip=Take the contract: its guarantee is held from your available funds (overdraft included). A crafting contract's ingredients are shipped to the import chests of the window's hub. Refused while you are insolvent.
decline-tooltip=Turn the offer down, at no cost.
abandon-tooltip=End the contract now: unless every required unit is already delivered, it fails, its guarantee is kept and your reputation drops by 1.
abandon-lease-tooltip=End the lease now: it fails, its guarantee is kept and your reputation drops by 1.
kind-warehouse=Warehouse rental: they store goods in one of your rental warehouses and take them back at the end, then pay the rent.
kind-storage=Vault: storage space you rent from them, charged every __1__ minutes whatever it holds.
refused-warehouse-gone=The rental warehouse is gone or no longer yours.
refused-warehouse-no-hub=The rental warehouse has no trading hub within 10 tiles to receive the goods.
refused-warehouse-not-empty=The rental warehouse must be empty to receive the goods: take out what an inserter put in it.
provides-warehouse-tooltip=Goods the counterparty stores with you: put straight into your rental warehouse when you accept.
requires-warehouse-tooltip=The same goods, which the counterparty takes back from the warehouse in the last second of the term through a hub of yours within 10 tiles; once accepted, taken back / stored.
due-warehouse-tooltip=End of the term: in its last second the counterparty takes its goods back, which needs a trading hub of yours within 10 tiles of the warehouse. If every unit is there, you get the rent and the guarantee back; a missing unit, or no hub, fails the contract, its guarantee is kept and your reputation drops by 1.
provides-vault-tooltip=What the vault holds: goods put in a vault uplink within __1__ tiles of its hub. They stay yours. Retrieve sends them to that hub; when the vault ends, however it ends, they go back to that hub, or to another hub of yours on its surface that has an import chest. Goods whose hub is removed before they land come back to the vault.
requires-vault-tooltip=Stacks the goods take, out of the vault's stacks. A vault takes items of normal quality that are not spoilable, damaged or carrying data.
vault-terms-tooltip=Charge: taken every __1__ min for the vault, whatever it holds, with or without a hub: it keeps your goods either way. A charge your funds cannot cover makes the vault fail: its guarantee is kept and your reputation drops by 1, and its goods are shipped back, never seized. Guarantee: one period's charge, held when you rent it, back at the end of the term.
due-vault-tooltip=End of the term: once its last period is charged, the guarantee comes back and the goods are shipped back to the hub by orbital capsule.
abandon-vault-tooltip=End the vault now: it fails, its guarantee is kept and your reputation drops by 1; its goods are shipped back to the hub.
retrieve=Retrieve
retrieve-tooltip=Ship what the vault holds to the import chests of its own hub by orbital capsule, free: one capsule of up to 10 stacks of one item launches every 10 s and lands 30 s after its launch; what the hub's capsule queue (20 shipments) cannot take stays in the vault. The vault stays rented.
